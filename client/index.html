<!doctype html>
<html lang="en" data-theme="mint">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ФинБУХ — бухгалтерский учёт и финансовый анализ для бизнеса</title>

    <meta
            name="description"
            content="ФинБУХ помогает ИП и компаниям вести бухгалтерский учёт, сдавать налоговую отчётность, анализировать финансы и получать понятную управленческую отчётность."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://finbuhsystem.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="ФинБУХ" />
    <meta property="og:url" content="https://finbuhsystem.ru/" />
    <meta property="og:title" content="ФинБУХ — бухгалтерия и финансовый анализ для бизнеса" />
    <meta
            property="og:description"
            content="Бухгалтерский учёт, налоговая отчётность, финансовый анализ и управленческая отчётность для ИП и компаний."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "ФинБУХ",
        "url": "https://finbuhsystem.ru/",
        "description": "Бухгалтерский учёт, налоговая отчётность, финансовый анализ и управленческая отчётность для бизнеса.",
        "areaServed": {
          "@type": "Country",
          "name": "Россия"
        },
        "knowsAbout": [
          "бухгалтерский учёт",
          "бухучёт",
          "налоговая отчётность",
          "финансовый анализ",
          "управленческая отчётность",
          "аутсорсинг бухгалтерии"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Бухгалтерский учёт",
              "description": "Ведение бухгалтерского учёта, работа с первичными документами и закрытие периодов."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Налоговая отчётность",
              "description": "Подготовка и сдача налоговой отчётности для бизнеса."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Финансовый анализ",
              "description": "Анализ доходов, расходов, прибыли и финансовых показателей бизнеса."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Управленческая отчётность",
              "description": "Подготовка понятной управленческой отчётности для собственника."
            }
          }
        ]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
